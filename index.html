<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Kartu Nama Interaktif</title>
  <!-- Load A-Frame dan MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Preload Aset 2D -->
    <a-assets>
      <img id="img-info" src="./assets/info-card.png" />
      <img id="img-ig" src="./assets/btn-ig.png" />
      <img id="img-porto" src="./assets/btn-porto.png" />
    </a-assets>

    <!-- Kamera dengan Raycaster -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Konten AR -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Banner Info 2D -->
      <a-image
        src="#img-info"
        position="0 0.65 0.05"
        width="1"
        height="0.4">
      </a-image>

      <!-- Tombol Instagram -->
      <a-image
        id="btn-ig"
        class="clickable"
        src="#img-ig"
        position="-0.3 -0.55 0.1"
        width="0.45"
        height="0.2"
        animation__click="property: scale; to: 1.15 1.15 1.15; dur: 150; dir: alternate; loop: 1; startEvents: click">
      </a-image>

      <!-- Tombol Portofolio -->
      <a-image
        id="btn-porto"
        class="clickable"
        src="#img-porto"
        position="0.3 -0.55 0.1"
        width="0.45"
        height="0.2"
        animation__click="property: scale; to: 1.15 1.15 1.15; dur: 150; dir: alternate; loop: 1; startEvents: click">
      </a-image>

    </a-entity>
  </a-scene>

  <!-- Panggil file JavaScript terpisah -->
  <script src="./script.js"></script>

</body>
</html>
